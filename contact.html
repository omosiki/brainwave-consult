<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Section</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #f8f9fa;
}

.contact-section {
    padding: 80px 0;
}

.section-title {
    font-weight: 700;
    color: #0d6efd;
}

.card-contact {
    border: none;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.icon-box {
    font-size: 25px;
    color: #0d6efd;
    margin-right: 10px;
}

.form-control {
    border-radius: 10px;
    padding: 12px;
}

.btn-send {
    border-radius: 30px;
    padding: 12px;
    font-weight: 600;
}

</style>
</head>

<body>

<section class="contact-section" id="contact">
<div class="container">

    <div class="text-center mb-5">
        <h2 class="section-title">Contact Us</h2>
        <p class="text-muted">Have questions? Reach out to us anytime</p>
    </div>

    <div class="row g-4">

        <!-- CONTACT INFO -->
        <div class="col-lg-5">
            <div class="card card-contact p-4 h-100">
                <h5 class="mb-4">Get In Touch</h5>

                <p><i class="fas fa-map-marker-alt icon-box"></i> Maiduguri, Borno State, Nigeria</p>
                <p><i class="fas fa-phone icon-box"></i> +234 800 000 0000</p>
                <p><i class="fas fa-envelope icon-box"></i> info@ijmbprogram.com</p>

                <hr>

                <h6 class="fw-bold">Office Hours</h6>
                <p class="mb-1">Mon - Fri: 8:00 AM - 5:00 PM</p>
                <p>Saturday: 9:00 AM - 2:00 PM</p>

                <div class="mt-3">
                    <a href="#" class="me-3"><i class="fab fa-facebook fa-lg"></i></a>
                    <a href="#" class="me-3"><i class="fab fa-whatsapp fa-lg"></i></a>
                    <a href="#"><i class="fab fa-instagram fa-lg"></i></a>
                </div>
            </div>
        </div>

        <!-- CONTACT FORM -->
        <div class="col-lg-7">
            <div class="card card-contact p-4">
                <h5 class="mb-4">Send a Message</h5>

                <form>
                    <div class="row g-3">

                        <div class="col-md-6">
                            <input type="text" class="form-control" placeholder="Full Name" required>
                        </div>

                        <div class="col-md-6">
                            <input type="email" class="form-control" placeholder="Email Address" required>
                        </div>

                        <div class="col-12">
                            <input type="text" class="form-control" placeholder="Subject">
                        </div>

                        <div class="col-12">
                            <textarea class="form-control" rows="5" placeholder="Your Message"></textarea>
                        </div>

                    </div>

                    <button class="btn btn-primary w-100 mt-4 btn-send">
                        <i class="fas fa-paper-plane"></i> Send Message
                    </button>
                </form>
            </div>
        </div>

    </div>

</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
